<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <pattern id="halftoneDots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#E8DDD0" fill-opacity="0.5"/>
    </pattern>
    <clipPath id="heartClip">
      <path d="M100,208
               C60,178 22,148 14,108
               C8,80 20,52 46,44
               C66,38 84,48 100,68
               C116,48 134,38 154,44
               C180,52 192,80 186,108
               C178,148 140,178 100,208 Z"/>
    </clipPath>
  </defs>

  <path d="M100,208
           C60,178 22,148 14,108
           C8,80 20,52 46,44
           C66,38 84,48 100,68
           C116,48 134,38 154,44
           C180,52 192,80 186,108
           C178,148 140,178 100,208 Z"
        fill="none" stroke="#E8DDD0" stroke-width="2" stroke-opacity="0.9"/>

  <g clip-path="url(#heartClip)" opacity="0.55">
    <rect x="100" y="120" width="90" height="90" fill="url(#halftoneDots)"/>
    <rect x="10" y="150" width="60" height="60" fill="url(#halftoneDots)"/>
  </g>

  <!-- aorta and great vessels -->
  <path d="M92,44 C88,28 92,14 104,8 C114,3 126,6 130,16"
        fill="none" stroke="#E8DDD0" stroke-width="2" stroke-opacity="0.85" stroke-linecap="round"/>
  <path d="M130,16 C138,10 148,10 154,18"
        fill="none" stroke="#E8DDD0" stroke-width="1.6" stroke-opacity="0.75" stroke-linecap="round"/>
  <path d="M104,8 L100,68" fill="none" stroke="#E8DDD0" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- pulmonary vessels -->
  <path d="M70,40 C60,30 58,18 66,10" fill="none" stroke="#E8DDD0" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M120,40 C110,26 112,14 122,6" fill="none" stroke="#E8DDD0" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- coronary arteries over the ventricles -->
  <path d="M100,70 C92,90 86,112 90,140 C93,162 100,182 100,198"
        fill="none" stroke="#9B1C1C" stroke-width="1.6" stroke-opacity="0.85" stroke-linecap="round"/>
  <path d="M100,80 C74,96 58,118 56,142 C55,158 62,172 74,180"
        fill="none" stroke="#9B1C1C" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round"/>
  <path d="M100,80 C126,96 142,118 144,142 C145,158 138,172 126,180"
        fill="none" stroke="#9B1C1C" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round"/>

  <!-- ventricular septum suggestion -->
  <path d="M100,70 L100,198" fill="none" stroke="#E8DDD0" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 3"/>
</svg>
